name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tester le code
        run: node --test tests/site.test.js

      - name: Construire l'image Docker
        run: docker build -t ghcr.io/klysh-devops/projet-devops-alex:${{ github.sha }} .

      - name: Démarrer le conteneur pour les tests HTTP
        run: |
          docker run -d \
            --name projet-devops-test \
            -p 8080:80 \
            ghcr.io/klysh-devops/projet-devops-alex:${{ github.sha }}

      - name: Vérifier /health
        run: node --test tests/health.test.js

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image Docker
        run: docker push ghcr.io/klysh-devops/projet-devops-alex:${{ github.sha }}

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Simuler le déploiement
        run: echo "🚀 CI validée, prêt pour le déploiement"
